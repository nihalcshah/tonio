[build]
  command = "CI= npm run build"
  publish = "build"
  functions = "netlify/functions"

[dev]
  command = "npm run start"
  functions = "netlify/functions"
  publish = "build"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
